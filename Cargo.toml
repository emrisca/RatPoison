[workspace]
resolver = "2"
members = [
    "crates/ratpoison-core",
    "crates/ratpoison-hid",
    "crates/ratpoison-a11y",
    "crates/ratpoison-tests",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/emrisca/RatPoison"
authors = ["Emrisca"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
