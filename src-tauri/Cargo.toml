[package]
name = "ratpoison"
version = "0.1.7"
description = "RatPoison — Lightning-fast, memory-safe, FOSS keyboard-driven mouse control utility"
authors = ["Emrisca"]
license = "MIT"
repository = "https://github.com/emrisca/RatPoison"
edition = "2021"

[lib]
name = "ratpoison_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ratpoison"
path = "src/main.rs"

[features]
# Embeds `frontend/dist` directly into the binary via Tauri's custom protocol.
# Enabled automatically by `cargo tauri build`, and manually via `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
ratpoison-core = { path = "../crates/ratpoison-core" }
ratpoison-hid = { path = "../crates/ratpoison-hid" }
ratpoison-a11y = { path = "../crates/ratpoison-a11y" }
