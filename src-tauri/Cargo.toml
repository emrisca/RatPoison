[package]
name = "ratpoison"
version = "0.1.0"
description = "RatPoison — Lightning-fast, memory-safe, keyboard-driven mouse control utility"
authors = ["Emrisca"]
license = "MIT"
repository = "https://github.com/emrisca/RatPoison"
edition = "2021"

[lib]
name = "ratpoison_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ratpoison"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratpoison-core = { path = "../crates/ratpoison-core" }
ratpoison-hid = { path = "../crates/ratpoison-hid" }
ratpoison-a11y = { path = "../crates/ratpoison-a11y" }
ratpoison-license = { path = "../crates/ratpoison-license" }
