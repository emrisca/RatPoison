name: Release RatPoison

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify Workspace & Frontend
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      prerelease: ${{ steps.release_tag.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Build & typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Rust workspace & Tauri tests
        run: |
          cargo test --workspace
          cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Prepare GitHub draft release (avoids matrix race)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          PRERELEASE: ${{ steps.release_tag.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [ "$PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --draft \
              $PRERELEASE_FLAG \
              --title "RatPoison ${TAG}" \
              --generate-notes
          fi

  build-tauri:
    name: Build Tauri Bundle (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust_targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri bundling dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libxtst-dev \
            libudev-dev \
            libinput-dev \
            libatspi2.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build & upload Tauri bundles to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          projectPath: .
          includeUpdaterJson: true
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: "RatPoison ${{ needs.verify.outputs.tag }}"
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Ensure latest.json includes all built platform signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, tempfile
          from pathlib import Path

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag.lstrip("vV")

          with tempfile.TemporaryDirectory() as tmp:
              tmp_dir = Path(tmp)
              subprocess.run(
                  ["gh", "release", "download", tag, "--repo", repo, "--pattern", "latest.json", "--pattern", "*.sig", "--dir", str(tmp_dir)],
                  check=False,
              )
              manifest_path = tmp_dir / "latest.json"
              if manifest_path.exists():
                  manifest = json.loads(manifest_path.read_text())
              else:
                  manifest = {"version": version, "notes": f"RatPoison {tag}", "platforms": {}}

              platforms = manifest.setdefault("platforms", {})
              base_url = f"https://github.com/{repo}/releases/download/{tag}"

              for sig_file in sorted(tmp_dir.glob("*.sig")):
                  sig_text = sig_file.read_text().strip()
                  asset_name = sig_file.name[:-4]
                  lower = asset_name.lower()
                  entry = {"signature": sig_text, "url": f"{base_url}/{asset_name}"}

                  if lower.endswith(".app.tar.gz"):
                      if "universal" in lower:
                          platforms.setdefault("darwin-aarch64", entry)
                          platforms.setdefault("darwin-x86_64", entry)
                      elif "aarch64" in lower or "arm64" in lower:
                          platforms.setdefault("darwin-aarch64", entry)
                      else:
                          platforms.setdefault("darwin-x86_64", entry)
                  elif lower.endswith("-setup.exe"):
                      platforms.setdefault("windows-x86_64", entry)
                  elif lower.endswith(".msi") and "windows-x86_64" not in platforms:
                      platforms["windows-x86_64"] = entry
                  elif lower.endswith(".appimage"):
                      platforms.setdefault("linux-x86_64", entry)

              manifest["version"] = version
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
              print("Verified latest.json platforms:", sorted(platforms.keys()))
              subprocess.run(
                  ["gh", "release", "upload", tag, str(manifest_path), "--repo", repo, "--clobber"],
                  check=True,
              )
          PYEOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
