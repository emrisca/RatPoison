name: Release RatPoison

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify Workspace & Frontend
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      prerelease: ${{ steps.release_tag.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Build & typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Rust workspace & Tauri tests
        run: |
          cargo test --workspace
          cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Prepare GitHub draft release (avoids matrix race)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          PRERELEASE: ${{ steps.release_tag.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [ "$PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --draft \
              $PRERELEASE_FLAG \
              --title "RatPoison ${TAG}" \
              --generate-notes
          fi

  build-tauri:
    name: Build Tauri Bundle (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust_targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri bundling dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libxtst-dev \
            libudev-dev \
            libinput-dev \
            libatspi2.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build & upload Tauri bundles to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          projectPath: .
          includeUpdaterJson: false
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: "RatPoison ${{ needs.verify.outputs.tag }}"
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
